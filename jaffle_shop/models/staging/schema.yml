version: 2

models:
  - name: stg_customers
    description: Clientes; un registro por customer_id. Un cliente puede realizar varios pedidos.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: Pedidos; un registro por order_id. Cada pedido pertenece a un cliente y puede tener varios pagos.
    columns:
      - name: order_id
        description: Identificador unico del pedido, referenciado por stg_payments.order_id.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Cliente del pedido; relacion muchos a uno con stg_customers.customer_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        description: '{{ doc("orders_status") }}'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    description: Pagos registrados; un registro por payment_id. Varios pagos pueden corresponder al mismo pedido. Los centimos se convierten a AUD en este modelo.
    columns:
      - name: payment_id
        description: Identificador unico de cada pago.
        tests:
          - unique
          - not_null
      - name: order_id
        description: Pedido del pago; relacion muchos a uno con stg_orders.order_id. No se permiten pagos huerfanos.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_method
        description: Metodo utilizado para registrar el pago, incluidos cupones y tarjetas regalo.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
      - name: amount
        description: Importe bruto registrado en AUD; no representa ingresos netos de reembolsos.
        tests:
          - not_null
