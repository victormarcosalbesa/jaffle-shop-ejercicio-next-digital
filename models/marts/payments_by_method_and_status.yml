version: 2

models:
  - name: payments_by_method_and_status
    description: '{{ doc("payments_by_method_and_status") }}'
    columns:
      - name: payment_method
        description: Metodo de pago registrado. Forma la clave compuesta junto a order_status.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
      - name: order_status
        description: '{{ doc("orders_status") }}'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
      - name: total_amount
        description: Suma de los pagos registrados en dolares australianos (AUD), con dos decimales.
        tests:
          - not_null
